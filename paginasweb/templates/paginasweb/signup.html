{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro | FlagManager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .signup-container {
      max-width: 500px;
      margin: 80px auto;
      padding: 2rem;
      border-radius: 10px;
      background-color: white;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    .logo-icon {
      font-size: 2.5rem;
      color: black;
    }
  </style>
</head>
<body>

<div class="signup-container">
    <div class="text-center mb-4">
      <div class="d-flex justify-content-center align-items-center gap-2">
        <i class="bi bi-flag-fill logo-icon"></i>
        <h3 class="fw-bold mb-0">FlagManager</h3>
      </div>
      <small class="text-muted">Gerencie suas feature flags com eficiência</small>
    </div>

  <h4 class="mb-3 text-center">Criar Conta</h4>

  <form method="POST">
    {% csrf_token %}
    <div class="mb-3">
      <label for="username" class="form-label">Usuário</label>
      <input type="text" name="username" id="username" class="form-control" placeholder="Ex: joaosilva" required>
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" name="email" id="email" class="form-control" placeholder="seuemail@dominio.com" required>
    </div>
    <div class="mb-3">
      <label for="senha" class="form-label">Senha</label>
      <input type="password" name="senha" id="senha" class="form-control" placeholder="********" required>
    </div>
    <div class="mb-3">
      <label for="confirmacao" class="form-label">Confirme a senha</label>
      <input type="password" name="confirmacao" id="confirmacao" class="form-control" placeholder="********" required>
    </div>
    <button type="submit" class="btn btn-success w-100">Cadastrar</button>
  </form>

  <div class="mt-3 text-center">
    <a href="{% url 'login' %}">Já tem conta? Login</a>
  </div>

  {% if messages %}
    <div class="mt-3">
      {% for message in messages %}
        <div class="alert alert-danger" role="alert">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
</div>

</body>
</html>
