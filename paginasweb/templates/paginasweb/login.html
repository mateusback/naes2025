{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login | FlagManager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .login-container {
      max-width: 400px;
      margin: 100px auto;
      padding: 2rem;
      border-radius: 10px;
      background-color: white;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    .logo-icon {
      font-size: 2rem;
      color: black;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="text-center mb-4">
    <div class="d-flex justify-content-center align-items-center gap-2">
      <i class="bi bi-flag-fill logo-icon"></i>
      <h3 class="fw-bold mb-0">FlagManager</h3>
    </div>
    <small class="text-muted">Gerencie suas feature flags com eficiência</small>
  </div>

  <h4 class="mb-3 text-center">Login</h4>

  <form method="POST">
    {% csrf_token %}
    <div class="mb-3">
      <label for="username" class="form-label">Usuário</label>
      <input type="text" name="username" id="username" class="form-control" placeholder="Digite seu usuário" required>
    </div>
    <div class="mb-3">
      <label for="senha" class="form-label">Senha</label>
      <input type="password" name="senha" id="senha" class="form-control" placeholder="Digite sua senha" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Entrar</button>
  </form>

  <div class="mt-3 text-center">
    <a href="{% url 'signup' %}">Não tem conta? Cadastre-se</a>
  </div>

  {% if messages %}
    <div class="mt-3">
      {% for message in messages %}
        <div class="alert alert-danger" role="alert">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
</div>

</body>
</html>
