{% extends "paginasweb/index.html" %}
{% load crispy_forms_tags %}

{% block conteudo %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6">
    <div class="card delete-card">
      <div class="card-body">

        <div class="delete-icon">
          <i class="bi bi-exclamation-triangle-fill"></i>
        </div>

        <h3 class="fw-bold">Você tem certeza?</h3>

        <p class="delete-text mt-3">
          Esta ação não pode ser desfeita. Isso irá remover permanentemente o item
          <span class="deleted-object-name">{{ object }}</span>.
        </p>

        <form method="post" class="mt-4">
          {% csrf_token %}

          <div class="d-none">
            {{ form|crispy }}
          </div>

          <div class="d-flex justify-content-center gap-2 mt-4">
            <a href="javascript:history.back()" class="btn btn-secondary px-4">Cancelar</a>
            <button type="submit" class="btn btn-danger px-4">
              Sim, excluir
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
