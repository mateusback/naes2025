{% extends "paginasweb/index.html" %}
{% load crispy_forms_tags %}

{% block conteudo %}
  <div class="container mt-5">
    <div class="card shadow-sm">
      <div class="card-header bg-danger text-white">
        <h4 class="mb-0">Tem certeza que deseja deletar <strong>{{ object }}</strong>?</h4>
      </div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <div class="text-end mt-4">
            <button type="submit" class="btn btn-danger px-4">
              <i class="bi bi-trash-fill me-2"></i>Confirmar
            </button>
            <a href="javascript:history.back()" class="btn btn-secondary ms-2">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
